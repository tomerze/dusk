[package]
name = "dusk_py_lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "dusk"
crate-type = ["cdylib"]

[dependencies]
dusk_py = { path = "../../dusk/src/dusk_py" }
pyo3 = { version = "0.27.0", features = ["extension-module"] }

# Add dusk programs here as needed
dusk_program_ps = { path = "../../programs/ps", features = ["client"] }
