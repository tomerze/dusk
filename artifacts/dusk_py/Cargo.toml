[package]
name = "dusk_py_lib"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
name = "dusk"
crate-type = ["cdylib"]

[dependencies]
dusk_py = { path = "../../dusk/src/dusk_py" }
pyo3 = { version = "0.27.0", features = ["extension-module"] }

dusk_base = { path = "../../dusk/src/dusk_base", features = ["client"] }
