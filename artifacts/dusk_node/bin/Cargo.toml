[package]
name = "dusk_node_bin"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "dusk_node"
path = "src/main.rs"

[features]
default = ["impl_nix"]
impl_nix = ["dusk_node/impl_nix"]
impl_std = ["dusk_node/impl_std"]
impl_windows = ["dusk_node/impl_windows"]

[dependencies]
dusk_node = { path = "../lib", default-features = false }
