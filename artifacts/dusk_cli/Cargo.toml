[package]
name = "dusk_cli_bin"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dusk"
path = "src/main.rs"

[dependencies]
dusk_cli = { path = "../../dusk/src/dusk_cli" }
anyhow = "1.0"

# Add dusk programs here as needed
dusk_program_ps = { path = "../../programs/ps", features = ["client"] }
dusk_program_kill = { path = "../../programs/kill", features = ["client"] }
dusk_program_true = { path = "../../programs/true", features = ["client"] }
dusk_program_false = { path = "../../programs/false", features = ["client"] }
dusk_program_sleep = { path = "../../programs/sleep", features = ["client"] }
