name: CI

# Every push to a pull request runs the full set of checks, as does every push
# to master.
on:
  pull_request:
  push:
    branches: [master]

# Every job only reads the repository. Declaring that here overrides whatever
# the repository's default token permissions are, so a compromised dependency
# cannot use GITHUB_TOKEN to write to the repository.
permissions:
  contents: read

# A new push to the same pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job here compiles the workspace, so there is no cargo cache and no
# target directory to keep: cargo fmt parses sources and never runs a build
# script, and the other four jobs never invoke cargo at all.
jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no moving major tag, only exact versions, so this
      # reference is pinned where the others are not.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Both commands mirror the ruff-check and ruff-format hooks in
      # .pre-commit-config.yaml, including their file scope.
      - name: ruff check
        run: uvx ruff check --force-exclude dusk/src/dusk_py/python/ tests/gw/

      - name: ruff format
        run: uvx ruff format --check --force-exclude dusk/src/dusk_py/python/ tests/gw/

  python-tests:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --no-install-project keeps this job off the Rust toolchain: installing
      # the project itself would build the dusk_py extension through maturin.
      # Its dependencies still come from uv.lock, so this job tests the versions
      # the project actually pins rather than whatever resolves today - naming
      # them on the command line instead is how this job once installed mcp 2.0
      # against a tree written for 1.x. The gateway's tests supply their own
      # connections and program set and stub the extension out, so they need
      # nothing the lockfile does not already carry. The end-to-end tests that
      # do drive a real node live in tests/py and are not run here.
      - name: Install the locked dependencies
        run: uv sync --no-install-project

      - name: pytest
        run: .venv/bin/python -m pytest tests/gw -q

  c-lint:
    name: C (clang-format, clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # The versions are the ones .pre-commit-config.yaml pins: clang-format
      # from mirrors-clang-format v19.1.7, clang-tidy from the local hook's
      # additional_dependencies. artifacts/dusk_node/include/dusk.h is the only
      # C file left in the repository; both hooks also name
      # dusk/src/dusk_llm/warmup/main.c, which no longer exists.
      - name: clang-format
        run: >
          uvx --from clang-format==19.1.7 clang-format --dry-run --Werror
          artifacts/dusk_node/include/dusk.h

      - name: clang-tidy
        run: >
          uvx --from clang-tidy==19.1.0 clang-tidy --quiet
          artifacts/dusk_node/include/dusk.h
          --
          -std=c11

  docs:
    name: Docs (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --strict turns mkdocs warnings, such as a link to a page that does not
      # exist, into a failure.
      - name: mkdocs build
        working-directory: docs
        run: uv run mkdocs build --strict

  rust-fmt:
    name: Rust (fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml and installs the pinned nightly along
      # with the rustfmt component it names. Installing the toolchain is the
      # bulk of this job; the check itself is under a second.
      - name: Install the pinned toolchain
        run: rustup show

      # rustfmt parses the sources and never builds, so this needs neither the
      # vendor/capnproto submodule nor a target directory.
      - name: cargo fmt
        run: cargo fmt --all -- --check
