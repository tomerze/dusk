name: CI

on:
  pull_request:
  push:
    branches: [master, services]

# Every job only reads the repository. Declaring that here overrides whatever
# the repository's default token permissions are, so a compromised dependency
# cannot use GITHUB_TOKEN to write to the repository.
permissions:
  contents: read

# A new push to the same pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no moving major tag, only exact versions, so this
      # reference is pinned where the others are not.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Both commands mirror the ruff-check and ruff-format hooks in
      # .pre-commit-config.yaml, including their file scope.
      - name: ruff check
        run: uvx ruff check --force-exclude dusk/src/dusk_py/python/ tests/interfaces/gw/ services/dawn/

      - name: ruff format
        run: uvx ruff format --check --force-exclude dusk/src/dusk_py/python/ tests/interfaces/gw/ services/dawn/

  python-tests:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --no-install-project keeps this job off the Rust toolchain: installing
      # the project itself would build the dusk_py extension through maturin.
      # Its dependencies still come from uv.lock, so this job tests the versions
      # the project actually pins rather than whatever resolves today - naming
      # them on the command line instead is how this job once installed mcp 2.0
      # against a tree written for 1.x. The gateway's tests supply their own
      # connections and program set and stub the extension out, so they need
      # nothing the lockfile does not already carry. The end-to-end tests that
      # do drive a real node live in tests/interfaces/py and are not run here.
      - name: Install the locked dependencies
        run: uv sync --no-install-project

      - name: pytest
        run: .venv/bin/python -m pytest tests/interfaces/gw -q

  dawn:
    name: dawn (pyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dawn
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked --no-install-package dusk

      - name: pyright
        run: uvx pyright

      - name: pytest
        run: .venv/bin/python -m pytest -q

  c-lint:
    name: C (clang-format, clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # The versions are the ones .pre-commit-config.yaml pins: clang-format
      # from mirrors-clang-format v19.1.7, clang-tidy from the local hook's
      # additional_dependencies. artifacts/dusk_node/lib/include/dusk.h is the
      # only C file left in the repository.
      - name: clang-format
        run: >
          uvx --from clang-format==19.1.7 clang-format --dry-run --Werror
          dusk/include/dusk.h

      - name: clang-tidy
        run: >
          uvx --from clang-tidy==19.1.0 clang-tidy --quiet
          dusk/include/dusk.h
          --
          -std=c11
          -DDUSK_PTHREAD

  docs:
    name: Docs (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --strict turns mkdocs warnings, such as a link to a page that does not
      # exist, into a failure.
      - name: mkdocs build
        working-directory: docs
        run: uv run mkdocs build --strict

  docs-format:
    name: Docs (prettier, djlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: prettier
        run: >
          npx --yes prettier@3.6.2 --check
          "docs/docs/assets/stylesheets/*.css"
          "docs/docs/assets/javascripts/*.js"
          "docs/docs/assets/landing/*.svg"
          "docs/docs/assets/.icons/dusk/*.svg"

      - name: djlint
        run: uvx djlint@1.46.4 --check --profile=jinja --indent 2 docs/docs/assets/home.html

  rust-fmt:
    name: Rust (fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml and installs the pinned nightly along
      # with the rustfmt component it names. Installing the toolchain is the
      # bulk of this job; the check itself is under a second.
      - name: Install the pinned toolchain
        run: rustup show

      # rustfmt parses the sources and never builds, so this needs neither the
      # vendor/capnproto submodule nor a target directory.
      - name: cargo fmt
        run: cargo fmt --all -- --check

  go:
    name: Go (gofmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/twilight
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/twilight/go.mod
          cache-dependency-path: services/twilight/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -short ./...

  go-integration:
    name: Go (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/twilight
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/twilight/go.mod
          cache-dependency-path: services/twilight/go.sum

      - name: go test -tags integration
        run: go test -tags integration -timeout 30m ./...

  ui:
    name: UI (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/twilight/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/twilight/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm test

      - name: build
        run: npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/twilight/go.mod
          cache-dependency-path: services/twilight/go.sum

      - name: go build -tags ui
        working-directory: services/twilight
        run: go build -tags ui -o /dev/null ./cmd/twilight

  contracts:
    name: Contracts (validate, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: validate.py
        run: uv run --no-project --with jsonschema --with referencing python services/contracts/validate.py

      - name: pytest
        run: uv run --no-project --with pytest --with jsonschema --with referencing pytest services/contracts/tests -q

  rust:
    name: Rust (clippy, nextest; the nightfall packages build once pull request #174 is merged)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo clippy
        run: >
          cargo clippy --locked
          --package nightfall
          --package nightfall_membrane
          --package nightfall_ledger
          --package nightfall_provisioning
          --package dusk_program_nightfall
          --package dusk_connection
          --package dusk_capnp
          --package dusk_py
          --package dusk_api_tests
          --package dusk_py_tests
          -- -D warnings

      - name: cargo nextest
        run: >
          cargo nextest run --locked
          --package nightfall
          --package nightfall_membrane
          --package nightfall_ledger
          --package nightfall_provisioning
          --package dusk_program_nightfall
          --package dusk_connection
          --package dusk_capnp
          --package dusk_py
          --package dusk_api_tests
          --package dusk_py_tests

  kustomize:
    name: Kubernetes (kustomize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.37.1

      - name: dev overlay
        run: kubectl kustomize infra/k8s/overlays/dev > /dev/null

      - name: prod overlay
        run: kubectl kustomize infra/k8s/overlays/prod > /dev/null
