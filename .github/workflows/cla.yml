name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

env:
  CLA_URL: ${{ github.server_url }}/${{ github.repository }}/blob/master/docs/docs/legal/cla.md

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor Assignment Agreement
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Dusk Contributor Assignment Agreement, I am at least eighteen years old, and I sign it.') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: ${{ env.CLA_URL }}
          branch: cla-signatures
          allowlist: ${{ github.repository_owner }},dependabot[bot]
          custom-pr-sign-comment: 'I have read the Dusk Contributor Assignment Agreement, I am at least eighteen years old, and I sign it.'
          lock-pullrequest-aftermerge: false
