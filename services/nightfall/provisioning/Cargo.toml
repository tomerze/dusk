[package]
name = "nightfall_provisioning"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
base64 = "0.22"
hex = "0.4"
ring = "0.17"
rustls-pki-types = { version = "1.12", features = ["std"], public = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", public = true }
thiserror = "2"
toml = "0.9"
x509-parser = { version = "0.18", features = ["verify"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
