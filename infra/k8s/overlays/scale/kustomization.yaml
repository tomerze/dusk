apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dusk
labels:
  - pairs:
      app.kubernetes.io/part-of: dusk-stack
resources:
  - ../dev
  - simulator-ca.yaml
  - nightfall-simulator.yaml
configMapGenerator:
  - name: grafana-scale-dashboard
    files:
      - scale.json=grafana-scale.json
patches:
  - path: nightfall.yaml
  - path: grafana.yaml
