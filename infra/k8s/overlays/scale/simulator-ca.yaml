apiVersion: v1
kind: ServiceAccount
metadata:
  name: nightfall-simulator-ca
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nightfall-simulator-ca
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [nightfall-simulator-ca]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [dusk-trust-anchors]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [nightfall-simulator-trust]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nightfall-simulator-ca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nightfall-simulator-ca
subjects:
  - kind: ServiceAccount
    name: nightfall-simulator-ca
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nightfall-simulator-ca
  labels:
    app.kubernetes.io/name: nightfall-simulator-ca
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nightfall-simulator-ca
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: nightfall-simulator-ca
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator-ca
          image: smallstep/step-cli:0.31.0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              helper=/scripts/kubernetes.sh
              ca=/work/secret/nightfall-simulator-ca
              status=0
              "$helper" fetch secret nightfall-simulator-ca "$ca" || status=$?
              case "$status" in
                  0) echo "secret nightfall-simulator-ca exists, kept" ;;
                  3)
                      mkdir -p "$ca"
                      step certificate create "Dusk simulator CA" "$ca/tls.crt" /work/sec1.key \
                          --profile root-ca --not-after 87600h --kty EC --crv P-256 --no-password --insecure > /dev/null
                      step crypto key format --pkcs8 --pem --no-password --insecure --out "$ca/tls.key" /work/sec1.key > /dev/null
                      rm /work/sec1.key
                      "$helper" create-new secret /work/secret
                      ;;
                  *) exit "$status" ;;
              esac
              "$helper" fetch configmap dusk-trust-anchors /work/anchors
              mkdir -p /work/configmap/nightfall-simulator-trust
              cat /work/anchors/fleet-client-ca.crt "$ca/tls.crt" > /work/configmap/nightfall-simulator-trust/fleet-client-ca.crt
              "$helper" apply configmap /work/configmap
          env:
            - name: HOME
              value: /work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: work
              mountPath: /work
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: dusk-bootstrap-scripts
            defaultMode: 0555
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
