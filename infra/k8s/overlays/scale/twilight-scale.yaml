apiVersion: batch/v1
kind: Job
metadata:
  name: scale-load
  labels:
    app.kubernetes.io/name: scale-load
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scale-load
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: dusk-twilight-scale:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: twilight-scale
          args:
            - load
            - --twilight
            - http://twilight:8080
            - --token-file
            - /run/secrets/scale-token/token
            - --run
            - $(SCALE_RUN)
            - --campaigns
            - $(SCALE_CAMPAIGNS)
            - --nodes-per-campaign
            - $(SCALE_NODES_PER_CAMPAIGN)
            - --links-per-simulator
            - $(SCALE_LINKS_PER_SIMULATOR)
            - --rate
            - $(SCALE_RATE)
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: token
              mountPath: /run/secrets/scale-token
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: twilight-scale-token
            defaultMode: 0440
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scale-report
  labels:
    app.kubernetes.io/name: scale-report
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scale-report
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: report
          image: dusk-twilight-scale:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: twilight-scale
          args:
            - report
            - --run
            - $(SCALE_RUN)
            - --postgres
            - postgres://scale@postgres:5432/inventory?sslmode=disable&passfile=/run/secrets/postgres-scale/pgpass
            - --clickhouse
            - http://clickhouse:8123
            - --clickhouse-password-file
            - /run/secrets/clickhouse-grafana/password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: postgres-scale
                  items:
                    - key: pgpass
                      path: postgres-scale/pgpass
              - secret:
                  name: clickhouse-grafana
                  items:
                    - key: password
                      path: clickhouse-grafana/password
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scale-load
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scale-load
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: twilight
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scale-report
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scale-report
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - protocol: TCP
          port: 8123
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: twilight-scale-load
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: twilight
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scale-load
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-scale-report
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scale-report
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-scale-report
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scale-report
      ports:
        - protocol: TCP
          port: 8123
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-scale-report
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scale-report
      ports:
        - protocol: TCP
          port: 9092
