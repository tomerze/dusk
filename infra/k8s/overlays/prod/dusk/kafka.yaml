apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    strimzi.io/cluster: dusk
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 500Gi
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      memory: 8Gi
  jvmOptions:
    -Xms: 4g
    -Xmx: 4g
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: dusk
spec:
  kafka:
    version: 4.2.1
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
        networkPolicyPeers:
          - podSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [nightfall, dawn, twilight, vector, otel-collector, signoz]
    authorization:
      type: simple
    rack:
      topologyKey: topology.kubernetes.io/zone
    config:
      auto.create.topics.enable: false
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      unclean.leader.election.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
