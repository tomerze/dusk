apiVersion: batch/v1
kind: Job
metadata:
  name: pki-init
spec:
  template:
    spec:
      containers:
        - name: pki-init
          env:
            - name: PKI_SCOPE
              value: step-ca
            - name: DUSK_DOMAIN
              value: dusk.example
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ceph-init
spec:
  template:
    spec:
      containers:
        - name: ceph-init
          env:
            - name: S3_ENDPOINT
              value: http://rook-ceph-rgw-dusk.rook-ceph.svc
            - name: EVIDENCE_RETENTION_MODE
              value: COMPLIANCE
            - name: EVIDENCE_RETENTION_DAYS
              value: "400"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  template:
    spec:
      containers:
        - name: clickhouse
          env:
            - name: LAKE_URL
              value: http://rook-ceph-rgw-dusk.rook-ceph.svc/dusk-lake/
            - name: SIGNOZ_COLD_URL
              value: http://rook-ceph-rgw-dusk.rook-ceph.svc/signoz-cold/clickhouse/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - name: DUSK_POSTGRES_ADDRESS
              value: postgres-ro:5432
            - name: DUSK_POSTGRES_SSLMODE
              value: verify-full
            - name: DUSK_POSTGRES_ROOT_CERTIFICATE
              value: /run/secrets/postgres-ca/ca.crt
            - name: DUSK_CLICKHOUSE_PORT
              value: "9440"
            - name: DUSK_CLICKHOUSE_SECURE
              value: "true"
            - name: DUSK_CLICKHOUSE_CA
              valueFrom:
                configMapKeyRef:
                  name: dusk-trust-anchors
                  key: internal-ca.crt
