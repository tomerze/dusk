apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: alerting-provisioning
          image: dusk-twilight:dev
          args: ["grafana-alerting", "--config", "/etc/twilight/twilight.yaml", "--output", "/provisioning/notifications.yaml"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: twilight-configuration
              mountPath: /etc/twilight
              readOnly: true
            - name: alerting-provisioning
              mountPath: /provisioning
      containers:
        - name: grafana
          image: dusk-grafana:dev
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /run/secrets/grafana-admin/password
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: alerting-provisioning
              mountPath: /etc/grafana/provisioning/alerting/notifications.yaml
              subPath: notifications.yaml
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: grafana-admin
                  items:
                    - key: password
                      path: grafana-admin/password
              - secret:
                  name: postgres-grafana
                  items:
                    - key: password
                      path: postgres-grafana/password
              - secret:
                  name: clickhouse-grafana
                  items:
                    - key: password
                      path: clickhouse-grafana/password
        - name: alerting-provisioning
          emptyDir:
            sizeLimit: 1Mi
        - name: twilight-configuration
          configMap:
            name: twilight
            defaultMode: 0444
            items:
              - key: twilight.yaml
                path: twilight.yaml
