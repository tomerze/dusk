apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nightfall
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nightfall
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dawn
      ports:
        - protocol: TCP
          port: 8444
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nightfall
      ports:
        - protocol: TCP
          port: 8445
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 9100
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: step-ca
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nightfall
      ports:
        - protocol: TCP
          port: 8445
