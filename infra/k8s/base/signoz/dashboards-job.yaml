apiVersion: batch/v1
kind: Job
metadata:
  name: signoz-dashboards
  labels:
    app.kubernetes.io/name: signoz-dashboards
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-dashboards
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signoz-dashboards
          image: python:3.14.8-slim-trixie
          command: ["python", "/dashboards/dashboards.py", "/dashboards"]
          env:
            - name: SIGNOZ_URL
              value: http://signoz:8080
            - name: SIGNOZ_EMAIL
              value: admin@dusk.test
            - name: SIGNOZ_PASSWORD_FILE
              value: /run/secrets/signoz-admin/password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: dashboards
              mountPath: /dashboards
              readOnly: true
            - name: signoz-admin
              mountPath: /run/secrets/signoz-admin
              readOnly: true
      volumes:
        - name: dashboards
          configMap:
            name: signoz-dashboards
        - name: signoz-admin
          secret:
            secretName: signoz-admin
            items:
              - key: password
                path: password
