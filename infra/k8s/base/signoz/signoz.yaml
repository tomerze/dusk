            - name: CLICKHOUSE_PORT
              value: "9000"
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_CLUSTER
              value: "dusk"
            - name: CLICKHOUSE_USER
              value: "signoz"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "clickhouse-signoz"
                  key: "password"
            - name: CLICKHOUSE_SECURE
              value: "false"
            
            
            
            
            
            
            
            - name: SQLSTORE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-signoz
            - name: SIGNOZ_TELEMETRYSTORE_PROVIDER
              value: "clickhouse"
            - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
              value: "tcp://clickhouse:9000/?username=$(CLICKHOUSE_USER)&password=$(CLICKHOUSE_PASSWORD)"
            - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_CLUSTER
              value: "dusk"
            - name: SIGNOZ_SQLSTORE_PROVIDER
              value: "postgres"
            - name: SIGNOZ_SQLSTORE_POSTGRES_DSN
              value: "postgres://signoz:$(SQLSTORE_POSTGRES_PASSWORD)@postgres:5432/signoz?sslmode=disable"
            - name: SIGNOZ_PROMETHEUS_ACTIVE__QUERY__TRACKER_ENABLED
              value: "false"
            - name: SIGNOZ_EMAILING_ENABLED
              value: "false"
            - name: SIGNOZ_ALERTMANAGER_SIGNOZ_EXTERNAL__URL
              value: "http://localhost:8080"
            - name: SIGNOZ_ALERTMANAGER_PROVIDER
              value: "signoz"
          livenessProbe:
            httpGet:
              port: http
              path: /api/v1/health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            httpGet:
              port: http
              path: /api/v1/health?live=1
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          volumeMounts:
            - name: signoz-db
              mountPath: /var/lib/signoz/
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
      volumes:
        - name: dashboards
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: signoz-db
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

