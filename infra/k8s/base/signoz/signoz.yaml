          args:
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-internal
              containerPort: 8085
              protocol: TCP
            - name: opamp-internal
              containerPort: 4320
              protocol: TCP
          env:
            
            - name: CLICKHOUSE_HOST
