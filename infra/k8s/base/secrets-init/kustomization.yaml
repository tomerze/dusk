apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: dusk-stack
resources:
  - rbac.yaml
  - job.yaml
  - network-policy.yaml
configMapGenerator:
  - name: dusk-bootstrap-scripts
    files:
      - generate.sh
      - kubernetes.sh
    options:
      disableNameSuffixHash: true
