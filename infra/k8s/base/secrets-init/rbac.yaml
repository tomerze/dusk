apiVersion: v1
kind: ServiceAccount
metadata:
  name: dusk-bootstrap
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dusk-bootstrap
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [nightfall-ledger]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dusk-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dusk-bootstrap
subjects:
  - kind: ServiceAccount
    name: dusk-bootstrap
