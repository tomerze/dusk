apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-init
  labels:
    app.kubernetes.io/name: secrets-init
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-init
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: dusk-bootstrap
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets-init
          image: smallstep/step-cli:0.31.0
          command: ["/bin/bash", "-c", "{ /scripts/kubernetes.sh fetch secret nightfall-ledger /work/secrets/nightfall-ledger || [ $? -eq 3 ]; } && /scripts/generate.sh /work/secrets > /dev/null && /scripts/kubernetes.sh create secret /work/secrets"]
          env:
            - name: FLEET_TOKEN_NAME
              value: default
            - name: FLEET_TOKEN_TENANT
              value: ""
            - name: HOME
              value: /work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: work
              mountPath: /work
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: dusk-bootstrap-scripts
            defaultMode: 0555
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
