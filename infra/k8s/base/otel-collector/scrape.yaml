receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: nightfall
          scrape_interval: 15s
          dns_sd_configs:
            - names: [nightfall-inner]
              type: A
              port: 9100
        - job_name: dawn
          scrape_interval: 15s
          dns_sd_configs:
            - names: [dawn]
              type: A
              port: 9101
        - job_name: twilight
          scrape_interval: 15s
          dns_sd_configs:
            - names: [twilight-pods]
              type: A
              port: 9102
        - job_name: vector
          scrape_interval: 15s
          dns_sd_configs:
            - names: [vector-pods]
              type: A
              port: 9598

service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
