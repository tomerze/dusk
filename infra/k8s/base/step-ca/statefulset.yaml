apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: step-ca
  labels:
    app.kubernetes.io/name: step-ca
spec:
  serviceName: step-ca
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: step-ca
  template:
    metadata:
      labels:
        app.kubernetes.io/name: step-ca
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: step-ca
          image: smallstep/step-ca:0.30.2
          command: ["step-ca", "--password-file", "/etc/step-ca/password/password", "/etc/step-ca/config/ca.json"]
          ports:
            - name: https
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: configuration
              mountPath: /etc/step-ca
              readOnly: true
            - name: database
              mountPath: /var/lib/step-ca/db
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: configuration
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: step-ca
                  items:
                    - key: ca.json
                      path: config/ca.json
                    - key: root_ca.crt
                      path: certs/root_ca.crt
                    - key: intermediate_ca.crt
                      path: certs/intermediate_ca.crt
                    - key: intermediate_ca_key
                      path: secrets/intermediate_ca_key
              - secret:
                  name: step-ca-password
                  items:
                    - key: password
                      path: password/password
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
