apiVersion: batch/v1
kind: CronJob
metadata:
  name: pki-renew
  labels:
    app.kubernetes.io/name: pki-renew
    app.kubernetes.io/component: bootstrap
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pki-renew
            app.kubernetes.io/component: bootstrap
        spec:
              serviceAccountName: dusk-pki
              automountServiceAccountToken: true
              restartPolicy: OnFailure
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: pki-init
                  image: smallstep/step-cli:0.31.0
                  command: ["/scripts/pki.sh", "kubernetes", "/work", "/home/step"]
                  env:
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: DUSK_NAMESPACE
                      value: $(POD_NAMESPACE)
                    - name: DUSK_DOMAIN
                      value: dusk.test
                    - name: PKI_SCOPE
                      value: all
                    - name: STEP_CA_DNS_NAMES
                      value: step-ca,step-ca.$(POD_NAMESPACE).svc,step-ca.$(POD_NAMESPACE).svc.cluster.local,localhost
                    - name: KUBERNETES_HELPER
                      value: /bootstrap/kubernetes.sh
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      memory: 256Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                  volumeMounts:
                    - name: scripts
                      mountPath: /scripts
                    - name: bootstrap
                      mountPath: /bootstrap
                    - name: work
                      mountPath: /work
                    - name: step
                      mountPath: /home/step
                    - name: temporary
                      mountPath: /tmp
              volumes:
                - name: scripts
                  configMap:
                    name: dusk-pki-scripts
                    defaultMode: 0555
                - name: bootstrap
                  configMap:
                    name: dusk-bootstrap-scripts
                    defaultMode: 0555
                - name: work
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Mi
                - name: step
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Mi
                - name: temporary
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Mi
