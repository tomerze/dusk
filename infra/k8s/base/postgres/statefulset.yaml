apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11-trixie
          args:
            - postgres
            - -c
            - tcp_keepalives_idle=10
            - -c
            - tcp_keepalives_interval=5
            - -c
            - tcp_keepalives_count=3
            - -c
            - tcp_user_timeout=15000
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres-superuser/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "--host", "127.0.0.1", "--username", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "--host", "127.0.0.1", "--username", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
            items:
              - key: init.sh
                path: 10-dusk.sh
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: postgres-superuser
                  items:
                    - key: password
                      path: postgres-superuser/password
              - secret:
                  name: postgres-twilight
                  items:
                    - key: password
                      path: postgres-twilight/password
              - secret:
                  name: postgres-grafana
                  items:
                    - key: password
                      path: postgres-grafana/password
              - secret:
                  name: postgres-signoz
                  items:
                    - key: password
                      path: postgres-signoz/password
        - name: run
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
