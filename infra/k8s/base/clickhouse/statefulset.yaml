apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  serviceName: clickhouse-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8.19.9
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            - name: CLICKHOUSE_REPLICA_HOST
              value: $(POD_NAME).clickhouse-headless.$(POD_NAMESPACE).svc
            - name: CLICKHOUSE_KEEPER_HOST
              value: clickhouse-keeper-0.clickhouse-keeper-headless.$(POD_NAMESPACE).svc
            - name: LAKE_URL
              value: http://ceph:8080/dusk-lake/
            - name: SIGNOZ_COLD_URL
              value: http://ceph:8080/signoz-cold/clickhouse/
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-admin
                  key: password
            - name: CLICKHOUSE_VECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-vector
                  key: password
            - name: CLICKHOUSE_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-grafana
                  key: password
            - name: CLICKHOUSE_SIGNOZ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-signoz
                  key: password
            - name: LAKE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ceph-reader
                  key: access-key
            - name: LAKE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ceph-reader
                  key: secret-key
            - name: SIGNOZ_COLD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ceph-signoz
                  key: access-key
            - name: SIGNOZ_COLD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ceph-signoz
                  key: secret-key
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
            - name: interserver
              containerPort: 9009
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: configuration
              mountPath: /etc/clickhouse-server/config.d/dusk.yaml
              subPath: config.yaml
            - name: configuration
              mountPath: /etc/clickhouse-server/users.d/dusk.yaml
              subPath: users.yaml
      volumes:
        - name: configuration
          configMap:
            name: clickhouse
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi
