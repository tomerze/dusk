sinks:
  clickhouse_ledger:
    type: clickhouse
    inputs: [ledger]
    endpoint: "${CLICKHOUSE_ENDPOINT:-http://clickhouse:8123}"
    tls:
      ca_file: "${CLICKHOUSE_TLS_CA:-/etc/ssl/certs/ca-certificates.crt}"
    database: dusk
    table: ledger
    date_time_best_effort: true
    skip_unknown_fields: false
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER:-vector}"
      password: "SECRET[clickhouse.password]"
    encoding:
      except_fields: [dt]
    batch:
      max_events: 20000
      max_bytes: 16777216
      timeout_secs: 5
    buffer:
      type: memory
      max_size: 16777216
      when_full: block
    request:
      timeout_secs: 60
    acknowledgements:
      enabled: true
  clickhouse_connections:
    type: clickhouse
    inputs: [connections]
