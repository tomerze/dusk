data_dir: /var/lib/vector
expire_metrics_secs: 300

api:
  enabled: true
  address: 0.0.0.0:8686

secret:
  clickhouse:
    type: directory
    path: /run/secrets/clickhouse
    remove_trailing_whitespace: true
  lake:
    type: directory
    path: /run/secrets/lake
    remove_trailing_whitespace: true
  evidence:
    type: directory
    path: /run/secrets/evidence
    remove_trailing_whitespace: true

sources:
  kafka_ledger:
    type: kafka
    bootstrap_servers: "${KAFKA_BROKERS:-kafka:9092}"
    group_id: vector-ledger
    topics: [dusk.ledger]
    auto_offset_reset: earliest
    log_namespace: false
    decoding:
      codec: bytes
    librdkafka_options:
      client.id: vector
      queued.max.messages.kbytes: "16384"
      allow.auto.create.topics: "false"
      isolation.level: read_committed
      security.protocol: "${KAFKA_SECURITY_PROTOCOL:-plaintext}"
      ssl.ca.location: "${KAFKA_TLS_CA:-/etc/vector/kafka/ca.crt}"
      ssl.certificate.location: "${KAFKA_TLS_CERTIFICATE:-/etc/vector/kafka/user.crt}"
      ssl.key.location: "${KAFKA_TLS_KEY:-/etc/vector/kafka/user.key}"
  kafka_connections:
