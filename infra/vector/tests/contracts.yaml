tests:
  - name: ledger checkpoint keeps its signature and turns the null identity into empty strings
    inputs:
      - insert_at: ledger
        type: vrl
        source: |
          . = {"message": s'{"schema":"dusk.ledger/v1","id":"01a112fe-d1bb-72ae-b6bf-fee09a291aee","time":"2026-10-06T09:15:41.512408218Z","kind":"checkpoint","instance":"nightfall-0","partition":0,"sequence":42,"previous_hash":"4c1e9a7f3b5d2e8c0a6f4b1d9e7c3a5f2b8d0e6c4a1f9b7d5e3c2a0f8b6d4e1c","hash":"a7d3f1c9e5b2084f6a1d3c5e7b9f0a2c4e6d8b1f3a5c7e9d0b2f4a6c8e1d3b5f","device_id":null,"installation_id":null,"namespace_id":null,"epoch":null,"principal":"nightfall","pid":"0","intent_campaign_id":null,"intent_principal":null,"intent_subject":null,"session_id":null,"call_id":null,"cap_id":null,"parent_cap_id":null,"direction":null,"action":null,"interface_id":null,"method_id":null,"param_fields":[],"param_cap_ids":[],"param_hash":"","result_code":null,"result_cap_ids":[],"event":null,"event_detail":null,"key_id":"nightfall-ledger-2026-10","signature":"g55ZZRZD/YxRYBheTFik7dq86GTe/OhQO9kRCU+dwms0HKxuKAue+Bummf/V6/cSB60+Skn531tKBGplLGcTkQ=="}', "topic": "dusk.ledger", "partition": 0, "offset": 42}
    outputs:
      - extract_from: ledger
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kind, "checkpoint")
              assert_eq!(.pid, "0")
              assert_eq!(.sequence, 42)
              assert_eq!(.device_id, "")
              assert_eq!(.installation_id, "")
              assert_eq!(.namespace_id, null)
              assert_eq!(.epoch, null)
              assert_eq!(.param_fields, [])
              assert_eq!(.event_detail, null)
              assert_eq!(.intent_principal, null)
              assert_eq!(.key_id, "nightfall-ledger-2026-10")
              assert_eq!(.signature, "g55ZZRZD/YxRYBheTFik7dq86GTe/OhQO9kRCU+dwms0HKxuKAue+Bummf/V6/cSB60+Skn531tKBGplLGcTkQ==")
              assert_eq!(.time, t'2026-10-06T09:15:41.512408218Z')
              assert_eq!(.kafka_offset, 42)

  - name: ledger call keeps its parameter fields and capability ids
