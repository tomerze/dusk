          . = {"message": s'{"schema":"dusk.process-output/v1","id":"01a112fe-d1bd-704c-9bd1-233e2a09f71a","time":"2026-10-06T09:15:54.512408231Z","pid":"13792273858822192861","campaign_id":"0192f3a4-5b6c-7d8e-9f01-23456789abcd","device_id":"3f9c0e2a7b5d4c1e8a6f0b2d9e7c5a13","installation_id":"a41e6c2f9b0d4e7a8c3f5b1d2e9a6c70","namespace_id":"5d2e9a1c7b3f8e04","index":4096,"value":null,"truncated":true}', "topic": "dusk.process-output", "partition": 0, "offset": 1}
