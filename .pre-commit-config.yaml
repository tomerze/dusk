repos:
  -   repo: https://github.com/doublify/pre-commit-rust
      rev: v1.0
      hooks:
      -   id: fmt
      -   id: clippy
  -   repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v19.1.7
      hooks:
      -   id: clang-format
          files: ^dusk/include/.*\.(c|h)$
  -   repo: local
      hooks:
      -   id: clang-tidy
          name: clang-tidy
          entry: clang-tidy
          language: python
          additional_dependencies: ["clang-tidy==19.1.0"]
          pass_filenames: false
          files: ^dusk/include/.*\.h$
          args:
          -   --quiet
          -   dusk/include/dusk.h
          -   --
          -   -std=c11
          -   -DDUSK_PTHREAD
      -   id: ruff-check
          name: ruff (lint)
          entry: uvx ruff check --force-exclude
          language: system
          types_or: [python, pyi]
          files: ^(dusk/src/dusk_py/python/|tests/interfaces/gw/|services/dawn/)
      -   id: ruff-format
          name: ruff (format)
          entry: uvx ruff format --force-exclude
          language: system
          types_or: [python, pyi]
          files: ^(dusk/src/dusk_py/python/|tests/interfaces/gw/|services/dawn/)
      -   id: pyright
          name: pyright
          entry: uvx pyright
          language: system
          types_or: [python, pyi]
          files: ^(dusk/src/dusk_py/python/|tests/interfaces/gw/)
          pass_filenames: false
      -   id: prettier
          name: prettier
          entry: prettier --write
          language: node
          additional_dependencies: ["prettier@3.6.2"]
          files: ^docs/docs/assets/(stylesheets|javascripts|landing|\.icons/dusk)/.*\.(css|js|svg)$
      -   id: djlint
          name: djlint
          entry: djlint --reformat --profile=jinja --indent 2
          language: python
          additional_dependencies: ["djlint==1.46.4"]
          files: ^docs/docs/assets/.*\.html$
      -   id: mkdocs-build
          name: mkdocs build --strict
          entry: bash -c 'cd docs && uv run mkdocs build --strict --quiet'
          language: system
          files: ^docs/
          pass_filenames: false
      -   id: pyright-dawn
          name: pyright (dawn)
          entry: uvx pyright -p services/dawn
          language: system
          types_or: [python, pyi]
          files: ^services/dawn/
          pass_filenames: false

fail_fast: true
