repos:
  -   repo: https://github.com/doublify/pre-commit-rust
      rev: v1.0
      hooks:
      -   id: fmt
      -   id: clippy
  -   repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v19.1.7
      hooks:
      -   id: clang-format
          files: ^dusk/include/.*\.(c|h)$
  -   repo: local
      hooks:
      -   id: clang-tidy
          name: clang-tidy
          entry: clang-tidy
          language: python
          additional_dependencies: ["clang-tidy==19.1.0"]
          pass_filenames: false
          files: ^dusk/include/.*\.h$
          args:
          -   --quiet
          -   dusk/include/dusk.h
          -   --
          -   -std=c11
          -   -DDUSK_PTHREAD
      -   id: ruff-check
          name: ruff (lint)
          entry: uvx ruff check --force-exclude
          language: system
          types_or: [python, pyi]
          files: ^(dusk/src/dusk_py/python/|tests/interfaces/gw/)
      -   id: ruff-format
          name: ruff (format)
          entry: uvx ruff format --force-exclude
          language: system
          types_or: [python, pyi]
          files: ^(dusk/src/dusk_py/python/|tests/interfaces/gw/)
      -   id: pyright
          name: pyright
          entry: uvx pyright
          language: system
          types_or: [python, pyi]
          files: ^(dusk/src/dusk_py/python/|tests/interfaces/gw/)
          pass_filenames: false

fail_fast: true
