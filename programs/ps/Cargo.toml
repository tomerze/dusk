[package]
name = "dusk_program_ps"
version = "0.1.0"
edition = "2024"

[dependencies]
dusk_capnp = { path = "../../dusk/src/dusk_capnp/", public = true}
dusk_program = { path = "../../dusk/src/dusk_program", public = true }
dusk_program_proc = { path = "../../dusk/src/dusk_program_proc", public = true }
slab = { version = "0.4.11", public = true }
anyhow = { version = "1.0.88", public = true }
dusk_program_sh = { path = "../sh", public = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing = { version = "0.1.41", default-features = false }
# Declared for macro use, versions taken from dusk_program
capnp = { version = "0.21", public = false }
linkme = { version = "*", optional = true, public = false }

[build-dependencies]
dusk_capnp = { path = "../../dusk/src/dusk_capnp/"}

[features]
client = ["linkme", "dusk_program_sh/client", "clap"] 
