[package]
name = "dusk_program_sh"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.28"
anyhow = { version = "1.0.99", default-features = false }
capnp = { version = "0.21.5", default-features = false, features = ["alloc"] }
dusk_capnp = { path = "../../dusk/src/dusk_capnp/", public = true}
dusk_program = { path = "../../dusk/src/dusk_program", public = true }
dusk = { path = "../../dusk/src/dusk/", public = true }
slab = { version = "0.4.11", public = true }
linkme = { version = "0.3", optional = true, public = true }

[build-dependencies]
dusk_capnp = { path = "../../dusk/src/dusk_capnp/"}

[features]
client = ["linkme"]
