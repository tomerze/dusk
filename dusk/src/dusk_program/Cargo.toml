[package]
name = "dusk_program"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.99", default-features = false, public = true }
embassy-sync = { version = "0.7.2", public = true }
embassy-futures = { version = "0.1.2", public = true }
embassy-time = { version = "0.5.0", public = true }
dusk_capnp = { path = "../dusk_capnp/", public = true }
futures = { version = "0.3.31", default-features = false, features = ["alloc"], public = true }
hashbrown = { version = "0.16", default-features = false, public = true }
indexmap = { version = "2.11.4", default-features = false, public = true }
oneshot = { version = "0.1.11", default-features = false, features = ["async"], public = true}
nohash-hasher = { version = "0.2", public = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], public = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], public = true }
rapidhash = { version = "4.1.0", default-features = false, public = true }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"], public = true }
async-trait = { version = "0.1.89", public = true }
embassy-executor = { version = "*", public = true }
log = "0.4.28"
