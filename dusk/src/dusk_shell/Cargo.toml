[package]
name = "dusk_shell"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full", "tracing"], public = true }
anyhow = { version = "1.0", features = ["backtrace"], public = true }
tracing = "0.1.41"
capnp = "0.21.5"
capnp-rpc = "0.21.0"
dusk_capnp = { path = "../dusk_capnp", public = true }
dusk_program = { path = "../dusk_program", public = true }
dusk_program_sh = { path = "../../../base/sh", features = ["client"], public = true }
