[package]
name = "dusk_prompt"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full", "tracing"], public = true }
tracing = "0.1.41"
reedline = { version = "0.47", features = ["sqlite", "idle_callback"], public = true}
crossterm = "0.29"
nu-ansi-term = "0.50.1"
nu-table = "0.107.0"
nu-color-config = "0.107.0"
nu-protocol = "0.107.0"
chrono = "0.4.42"
capnp =  "0.21.5"
dusk_capnp = { path = "../dusk_capnp", public = true }
dusk_shell = { path = "../dusk_shell", public = true }
dusk_program = { path = "../dusk_program/", public = true}
dusk_base = { path = "../dusk_base", features = ["client"], public = true }
termimad = { version = "0.20", public = true}
colored_json = "5.0.0"
base64 = "0.22.1"
unicode-width = "0.2"
dusk_llm = { path = "../dusk_llm" }
