[package]
name = "dusk_llm"
version = "0.1.0"
edition = "2024"

[dependencies]
dusk_program = { path = "../dusk_program/", public = true }
tokio = { version = "1.47.1", features = ["rt", "sync"] }
tracing = "0.1.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "http2",
    "charset",
] }
