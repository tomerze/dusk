[package]
name = "dusk_llm"
version = "0.1.0"
edition = "2024"

[dependencies]
dusk_program = { path = "../dusk_program/", public = true }
tokio = { version = "1.47.1", features = ["rt", "sync"] }
tracing = "0.1.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
# Regular dep for build ordering only: forces every `dusk_program_*`
# crate (with the `client` feature) to compile before this crate, so
# that the `.dusk_sh_entries/` directory has been populated by the time
# our build.rs reads it. Kept in the target graph (not [build-dependencies])
# so the workspace's embassy-executor feature unification stays intact.
dusk_base = { path = "../dusk_base", features = ["client"] }

[build-dependencies]
cmake = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
