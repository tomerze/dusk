# The GGUF weights `dusk_llm` embeds into the binary.
#
# `build.rs` downloads `url` into this directory on the first build and refuses
# to proceed unless the file's SHA-256 is `sha256` — on the first build and on
# every build after it. The model is embedded verbatim into the binary, so the
# wrong bytes are not a recoverable condition.
#
# `url` pins a Hugging Face *commit*, not a branch, so the bytes behind it
# cannot change. To move to different weights, change both fields together;
# `sha256` is the `lfs.sha256` Hugging Face reports for the file at that commit
# (`https://huggingface.co/api/models/<repo>?blobs=true`).
url = "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/0314792d7f1f7e229411f620751375812bb9faf2/gemma-4-E2B-it-Q4_K_M.gguf"
sha256 = "740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8"
