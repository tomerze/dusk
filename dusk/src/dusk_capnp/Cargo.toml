[package]
name = "dusk_capnp"
version = "0.1.0"
edition = "2021"

[dependencies]
capnp = { version = "0.21.5", default-features = false, features = ["alloc"], public = true }
capnp-rpc = { version = "0.21.0", default-features = false, public = true}
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], public = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], public = true }

[build-dependencies]
capnpc = { version = "0.21.4", default-features = false }
