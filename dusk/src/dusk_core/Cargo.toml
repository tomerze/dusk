[package]
name = "dusk_core"
version = "0.1.0"
edition = "2024"

[dependencies]

# Declared for macro use, version pinned to match dusk_program
embassy-executor = "0.10.0"
async-trait = "*"

tracing = { version = "0.1.41", default-features = false }
futures-io = { version = "0.3.31", default-features = false, public = true }
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
static_cell = "2.1.1"

dusk_capnp = { path = "../dusk_capnp/", public = true}
dusk_program = { path = "../dusk_program/", public = true}

[features]
# The high-frequency executor trace hooks in `trace.rs` (poll, task exec
# begin/end, idle). Task new/end always trace.
tracing = []
