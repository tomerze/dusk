[package]
name = "dusk_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full", "tracing"] }
anyhow = { version = "1.0", features = ["backtrace"] }
tracing = "0.1.41"
console-subscriber = "0.4.1"
tracing-subscriber = "0.3.20"
clap = { version = "4.5.47", features = ["derive"] }
wild = "2.2.1"
argfile = "0.2.1"
tokio-util = { version = "0.7.16", features = ["compat"]}
dusk_prompt = { path = "../dusk_prompt/" }
dusk_shell = { path = "../dusk_shell/" }
dusk_connection = { path = "../dusk_connection/" }
dusk_base = { path = "../dusk_base", features = ["client"], public = true }
capnp-rpc = "0.21.0"
atty = "0.2.14"
