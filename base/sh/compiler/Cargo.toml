[package]
name = "dusk_program_sh_compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
nom = { version = "8.0.0", default-features = false, features = ["alloc"], optional = true, public = true }
capnp = { version = "0.21.5", default-features = false, features = ["alloc"], public = true }

[build-dependencies]
dusk_capnp = { path = "../../../dusk/src/dusk_capnp/" }

[features]
parser = ["dep:nom"]
