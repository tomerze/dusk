[workspace]
members = [
    "artifacts/dusk_cli",
    "artifacts/dusk_node/bin",
    "artifacts/dusk_node/lib",
    "artifacts/dusk_py",
    "dusk/src/dusk_base",
    "dusk/src/dusk_build",
    "dusk/src/dusk_capnp",
    "dusk/src/dusk_cli",
    "dusk/src/dusk_connection",
    "dusk/src/dusk_core",
    "dusk/src/dusk_llm",
    "dusk/src/dusk_program",
    "dusk/src/dusk_program_proc",
    "dusk/src/dusk_py",
    "impls/nix",
    "impls/std",
    "impls/windows",
    "base/kill",
    "base/init",
    "base/nightfall",
    "base/programs",
    "base/ps",
    "base/sh",
    "base/false",
    "base/true",
    "base/sh/proc",
    "base/sh/compiler",
    "base/sh/compiler/proc",
    "base/sleep",
    "base/date",
    "base/logs",
    "base/hostname",
    "base/echo",
    "base/kvs",
    "base/kvs/internal",
    "tests/api",
    "tests/cli",
    "tests/common",
    "tests/py",
]
resolver = "2"

[profile.release]
strip = true

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.prod]
inherits = "release"
opt-level = "z"     # optimize for size
lto = "fat"         # whole-program dead-code elimination + cross-crate inlining
codegen-units = 1   # one unit → best size (slower compile)
strip = true
