{% extends "base.html" %}
{% block extrahead %}
  {% if config.site_url %}
    <meta property="og:image" content="{{ config.site_url }}assets/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Dusk logo">
    <meta name="twitter:card" content="summary_large_image">
  {% endif %}
  <script>
    try {
      const palette = __md_get("__palette");
      const schemes = {{ config.theme.palette | map(attribute="scheme") | list | tojson }};
      if (palette && (!palette.color || schemes[palette.index] !== palette.color.scheme)) {
        localStorage.removeItem(__md_scope.pathname + ".__palette");
      }
    } catch {}
  </script>
{% endblock %}
