      />
      <path d="M13.6 8.2a3.6 3.6 0 1 0 2.2 5.6 3 3 0 0 1-2.2-5.6Z" />
    </symbol>
    <symbol id="dusk-stack-icon-dawn" viewBox="0 0 24 24">
      <path d="M7 17a5 5 0 0 1 10 0" />
      <path d="M2.5 17h19M5 21h14" />
