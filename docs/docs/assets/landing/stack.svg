  <title id="dusk-stack-diagram-title">
    The Dusk stack, top to bottom: Nightfall, the security layer; Dawn, the
    client layer; Twilight, the orchestration layer; the data layer; the
    observability layer. The fleet connects in at the top.
  </title>
