site_name: Dusk Documentation
site_description: Documentation for the Dusk framework
repo_name: Dusk
repo_url: https://github.com/tomerze/dusk
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
      linenums: false
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
theme:
  name: material
  custom_dir: docs/assets
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/.icons/icon.svg
  icon:
    logo: icon
    repo: fontawesome/brands/github
nav:
  - Home: index.md
  - Crates: crates.md
  - Development:
      - development/index.md
      - Ask Dusk: development/ask_dusk.md
  - Concepts:
      - Programs: concepts/programs.md
      - Shell: concepts/shell.md
