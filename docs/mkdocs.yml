          - Default shell used without intent: stack/runbooks/default_shell_without_intent.md
          - Process on the wrong node: stack/runbooks/target_mismatch.md
          - Result without a ledger entry: stack/runbooks/result_without_ledger.md
          - Ledger chain broken: stack/runbooks/ledger_chain_broken.md
          - Revocation not enforced: stack/runbooks/revocation_not_enforced.md
          - Calls after the deadline: stack/runbooks/process_after_deadline.md
