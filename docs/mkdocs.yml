site_name: Dusk
site_description: Documentation for the Dusk project
site_url: !ENV SITE_URL
repo_name: Dusk
repo_url: https://github.com/tomerze/dusk
copyright: "© 2023-2026 Tomer Zeitune"
exclude_docs: /assets/home.html
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - !relative $docs_dir/assets/.icons
  - pymdownx.snippets:
      base_path: !relative $docs_dir
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
      linenums: false
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
theme:
  name: material
  custom_dir: docs/assets
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: Roboto Mono
  favicon: assets/landing/logo-d.svg
  logo: assets/landing/logo-d.svg
  icon:
    repo: fontawesome/brands/github
extra_css:
  - assets/stylesheets/extra.css
nav:
  - Introduction: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/guides/installation.md
      - Quickstart: getting-started/guides/quickstart.md
      - Connect a client: getting-started/guides/connect-a-client.md
      - Run a standalone node: getting-started/guides/run-a-node.md
      - Connect a node to nightfall: getting-started/guides/connect-to-nightfall.md
  - Embedding:
      - embedding/index.md
      - The C library: getting-started/guides/embed.md
      - Node artifacts: embedding/node-artifacts.md
  - Features:
      - Analytics: features/analytics.md
      - Diagnosis: features/diagnosis.md
      - Shell: features/shell.md
      - Logs: features/logs.md
      - Key-value store: features/kvs.md
      - Ask Dusk: features/ask-dusk.md
      - MCP: features/gateway.md
      - Base programs: getting-started/concepts/base.md
  - The Dusk stack:
