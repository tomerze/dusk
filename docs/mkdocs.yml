site_name: Dusk
site_description: Documentation for the Dusk framework
repo_name: Dusk
repo_url: https://github.com/tomerze/dusk
copyright: "© Dusk 2026"
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
      linenums: false
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
theme:
  name: material
  custom_dir: docs/assets
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
  favicon: assets/.icons/icon.svg
  icon:
    logo: icon
    repo: fontawesome/brands/github
extra_css:
  - assets/stylesheets/extra.css
nav:
  - Introduction: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/guides/installation.md
      - Quickstart: getting-started/guides/quickstart.md
      - Connect a client: getting-started/guides/connect-a-client.md
      - Run a standalone node: getting-started/guides/run-a-node.md
  - Embedding:
      - embedding/index.md
      - The C library: getting-started/guides/embed.md
  - Features:
      - Analytics: features/analytics.md
      - Diagnosis: features/diagnosis.md
      - Shell: features/shell.md
      - Logs: features/logs.md
      - Ask Dusk: features/ask-dusk.md
      - MCP: features/gateway.md
      - Base programs: getting-started/concepts/base.md
  - Customize:
      - customize/index.md
      - Concepts:
          - Programs: getting-started/concepts/programs.md
          - Namespaces: getting-started/concepts/namespaces.md
          - Processes: getting-started/concepts/processes.md
          - Signals: getting-started/concepts/signals.md
          - Launchers: getting-started/concepts/launchers.md
          - Portals & Streams: getting-started/concepts/portals-and-streams.md
          - Drivers & Impls: getting-started/concepts/drivers-and-impls.md
      - Write a program: getting-started/guides/first-program.md
      - Build a custom impl: getting-started/guides/custom-impl.md
  - Development:
      - development/index.md
      - Architecture: development/architecture.md
      - Shell: development/shell.md
      - The Trinity Problem: development/trinity.md
      - Logs: development/logs.md
      - Tracing and spans: development/tracing.md
      - Ask Dusk: development/ask_dusk.md
      - Contributing: development/contributing.md
  - SDK Reference:
      - Crates: sdk-reference/crates.md
      - CLI: sdk-reference/cli.md
      - Python API: sdk-reference/python-api.md
      - Proc macros: sdk-reference/proc-macros.md
      - Cap'n Proto schemas: sdk-reference/capnp-schemas.md
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tomerze/dusk
      name: Dusk on GitHub
