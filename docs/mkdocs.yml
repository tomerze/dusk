          - Campaign paused by its gate: stack/runbooks/campaign_paused_by_gate.md
          - Campaign failed by its policy: stack/runbooks/campaign_failed_by_policy.md
          - Campaign conflict: stack/runbooks/campaign_conflict.md
          - Critical alert unacknowledged: stack/runbooks/critical_alert_unacknowledged.md
          - Ledger chain broken in ClickHouse: stack/runbooks/clickhouse_ledger_chain_broken.md
          - Ledger evidence copy stalled: stack/runbooks/ledger_evidence_stalled.md
          - Alert delivery failing: stack/runbooks/alert_delivery_failing.md
          - Messages dropped by Vector: stack/runbooks/vector_messages_dropped.md
  - Telemetry:
      - Collected information: telemetry/collected-information.md
  - Customize:
