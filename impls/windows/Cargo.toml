[package]
name = "dusk_windows"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["trace", "platform-std", "nightly", "executor-thread"] }
embassy-time = { version = "0.5", features = ["std"] }
async-trait = "*"

dusk_core = { path = "../../dusk/src/dusk_core/" }
dusk_program = { path = "../../dusk/src/dusk_program", public = true }
dusk_program_kvs_internal = { path = "../../base/kvs/internal" }
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
critical-section = { version = "1", features = ["std"] }
getrandom = "0.2"
tracing = { version = "0.1.41", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_WindowsProgramming",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Time",
    "Win32_Security",
] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.100.0"
windows-registry = "0.100.0"
windows-result = "0.100.0"
machine-uid = "0.6.0"
