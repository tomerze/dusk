[package]
name = "dusk_nix"
version = "0.1.0"
edition = "2024"

[dependencies]
# Declared for macro use, versions taken from dusk_program
embassy-executor = { version = "*", features = ["arch-std", "log", "nightly", "executor-thread"]}
embassy-time = "*"
async-trait = "*"

env_logger = "0.11.8"
log = "0.4.28"
nix = { version = "0.30.1", features = ["hostname", "time"] }
dusk_core = { path = "../../dusk/src/dusk_core/" }
dusk_program = { path = "../../dusk/src/dusk_program", public = true }
lazy_static = { version = "1.5.0", features = ["spin_no_std"]}
critical-section = { version = "1", features = ["std"] }
rand = "0.8.5"
