[package]
name = "dusk_api_tests"
version = "0.1.0"
edition = "2024"

[dependencies]
dusk_tests = { path = "../common" }
dusk_shell = { path = "../../dusk/src/dusk_shell" }
dusk_connection = { path = "../../dusk/src/dusk_connection" }
dusk_capnp = { path = "../../dusk/src/dusk_capnp" }
dusk_program = { path = "../../dusk/src/dusk_program" }
dusk_program_kvs = { path = "../../base/kvs" }
dusk_program_ps = { path = "../../base/ps" }
dusk_program_logs = { path = "../../base/logs", features = ["client"] }
dusk_program_sh = { path = "../../base/sh", features = ["client"] }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
capnp = "0.21"
capnp-rpc = "0.21"
opentelemetry-proto = { version = "0.28", default-features = false, features = ["gen-tonic", "logs", "with-serde"] }
tonic = "0.12"
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = "0.23"
serde_json = "1"
tracing = "0.1.41"
